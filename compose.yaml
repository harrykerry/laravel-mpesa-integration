# Local services for development. Nothing here is needed in production, where
# you would point at managed Redis, RabbitMQ or MySQL instead.
#
#   docker compose up -d redis            # the default queue connection
#   docker compose up -d rabbitmq         # only if QUEUE_CONNECTION=rabbitmq
#   docker compose up -d mysql
#
# RabbitMQ's management UI is at http://localhost:15672 (guest / guest).

services:
    redis:
        image: redis:7-alpine
        ports:
            - '6379:6379'
        volumes:
            - redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            retries: 5

    rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
            - '5672:5672'
            - '15672:15672'
        environment:
            RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER:-guest}'
            RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASSWORD:-guest}'
        volumes:
            - rabbitmq:/var/lib/rabbitmq
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
            interval: 15s
            retries: 5

    mysql:
        image: mysql:8
        ports:
            - '3306:3306'
        environment:
            MYSQL_DATABASE: '${DB_DATABASE:-laravel_mpesa}'
            MYSQL_USER: '${DB_USERNAME:-laravel}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD:-secret}']
            interval: 15s
            retries: 5

volumes:
    redis:
    rabbitmq:
    mysql:
