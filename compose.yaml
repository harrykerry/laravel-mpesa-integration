# Everything needed to run this project locally in Docker.
#
#   docker compose up -d                  # app, queue worker, redis, mysql
#   docker compose --profile rabbitmq up -d   # add RabbitMQ
#
# The app is then on http://localhost:8000 and RabbitMQ's management UI on
# http://localhost:15672 (guest / guest). In production you would point the
# same variables at managed instances instead.

services:
    app:
        build: .
        ports:
            - '${APP_PORT:-8000}:8000'
        env_file: .env
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
            RABBITMQ_HOST: rabbitmq
        volumes:
            - .:/app
            - /app/vendor
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # The callbacks are processed here, not in the request.
    queue:
        build: .
        command: php artisan queue:work --queue=mpesa --tries=5
        env_file: .env
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
            RABBITMQ_HOST: rabbitmq
        volumes:
            - .:/app
            - /app/vendor
        depends_on:
            app:
                condition: service_started
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        ports:
            - '6379:6379'
        volumes:
            - redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            retries: 5

    # Only started with: docker compose --profile rabbitmq up -d
    rabbitmq:
        image: rabbitmq:3-management-alpine
        profiles: ['rabbitmq']
        ports:
            - '5672:5672'
            - '15672:15672'
        environment:
            RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER:-guest}'
            RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASSWORD:-guest}'
        volumes:
            - rabbitmq:/var/lib/rabbitmq
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
            interval: 15s
            retries: 5

    mysql:
        image: mysql:8
        ports:
            - '3306:3306'
        environment:
            MYSQL_DATABASE: '${DB_DATABASE:-laravel_mpesa}'
            MYSQL_USER: '${DB_USERNAME:-laravel}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD:-secret}']
            interval: 15s
            retries: 5

volumes:
    redis:
    rabbitmq:
    mysql:
